[package]
name = "tabs24"
version = "0.9.7"
edition = "2021"
description = "Yet Another Ethernet Accounting Ticket Loader - Rust port of tabs24.ps1 (OXE EAcc)"
authors = ["Jeepers-Gitters@github.com"]
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
colored = "2.1"

[profile.release]
opt-level = 3
codegen-units = 1
debug = false
lto = true
